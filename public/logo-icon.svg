<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo SIMPONITAS BPS Kabupaten Pasaman">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="logo-badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-blue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="bar-orange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Synergy Swoop Gradient -->
    <linearGradient id="swoop-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    
    <filter id="badge-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#logo-badge-bg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="url(#badge-shadow)" />

  <!-- Subtle Data Grid Matrix Accent (Precision & Quality) -->
  <line x1="12" y1="48" x2="52" y2="48" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <line x1="12" y1="36" x2="52" y2="36" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" />

  <!-- 3 Ascending Statistical Bars -->
  <!-- 1: Data Dasar OPD (Blue) -->
  <rect x="14" y="32" width="8" height="16" rx="3" fill="url(#bar-blue)" />

  <!-- 2: Pembinaan & Sinergi BPS (Pasaman Orange) -->
  <rect x="28" y="22" width="8" height="26" rx="3" fill="url(#bar-orange)" />

  <!-- 3: Kompromin Terbit Akurat & Berkualitas (Emerald Green) -->
  <rect x="42" y="14" width="8" height="34" rx="3" fill="url(#bar-green)" />

  <!-- Dynamic Sinergi Curve (Melambangkan alur pembinaan & garis khatulistiwa Pasaman) -->
  <path d="M 12 39 C 22 43, 26 21, 52 16" fill="none" stroke="url(#swoop-grad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Node points -->
  <circle cx="18" cy="32" r="2.5" fill="#FFFFFF" />
  <circle cx="32" cy="22" r="2.5" fill="#FFFFFF" />
  <circle cx="46" cy="14" r="3.2" fill="#FDE047" stroke="#0F172A" stroke-width="1" />
</svg>
